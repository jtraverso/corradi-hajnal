# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The Corrádi–Hajnal theorem on vertex-disjoint cycles"
  description: >-
    A Lean 4 / Mathlib formalization of the Corrádi–Hajnal theorem (1963): every finite simple
    graph on at least 3k vertices with minimum degree at least 2k contains k vertex-disjoint
    cycles. Cycles are closed walks that are cycles in Mathlib's sense; the theorem is also
    stated with the definition of disjoint cycles of the registered Erdős–Pósa entry (k pairwise
    disjoint vertex sets, each inducing a subgraph that is not acyclic). Both hypotheses are
    shown to be needed: for k ≥ 2 the complete graph on 3k − 1 vertices has minimum degree
    3k − 2 ≥ 2k and no k disjoint cycles, and for m ≥ 2k the complete bipartite graph
    K_{2k−1, m} has at least 3k vertices and minimum degree 2k − 1 and no k disjoint cycles.
    Mathlib has cycles and minimum degree but not this theorem.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C38", "05C70", "05C07"]

sources:
  - title: "On the maximal number of independent circuits in a graph"
    authors:
      - "K. Corrádi"
      - "A. Hajnal"
    id: "doi:10.1007/BF01895727"
    type: "paper"
    location: "Acta Mathematica Academiae Scientiarum Hungaricae 14 (1963), 423–439"
    relationship: "formalizes"
    note: >-
      The main theorem. The sharpness examples (complete graphs on 3k − 1 vertices and complete
      bipartite graphs K_{2k−1, m}) are the standard ones and are proved here as accompanying
      statements. The formal proof is an induction on the number of non-edges with an optimal
      family of disjoint cyclic vertex sets and exchange arguments, not a transcription of the
      original paper.
    license: "all rights reserved"
    author_endorsement: "n/a"

related_formalizations:
  - id: "PALOMAR-2026-10-20-000003 (jtraverso/erdos-posa-cycles)"
    relationship: "other"
    note: >-
      CyclePacking.HasDisjointCycles is copied verbatim from that entry's Challenge, and
      corradi_hajnal_sets states the theorem with it (bridge in CorradiHajnal/SetForm.lean).

status:
  scope: >-
    Proved for every finite simple graph and every k: n ≥ 3k and δ(G) ≥ 2k give k vertex-disjoint
    cycles; for k = 0 the statement is trivial. The sharpness statements hold for every k ≥ 2
    (complete graphs) and every k ≥ 1, m ≥ 2k (complete bipartite graphs).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Produced the proofs (project bf9d42ad, 12 files) from the formal statements and a proof
        outline supplied under the author's direction.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "Formal statements and a natural-language proof route."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Wrote the statements and sanity checks (small complete graphs), audited the return,
        migrated it to Lean v4.35.0-rc3 and the module system, wrote the bridge to the Erdős–Pósa
        definition, the Challenge/Solution pair and the packaging, checked with a local build, a
        comparison of the elaborated Challenge and Solution declarations (pp.all) and #print
        axioms (Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "a few hours"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "not tracked"
  notes: >-
    The results were chosen by the human author; the Lean proofs are AI-generated and
    mechanically verified (no sorry, axioms limited to propext, Classical.choice and Quot.sound).

fidelity:
  divergences: >-
    Graphs are Mathlib simple graphs on finite vertex types; the degree condition is
    2k ≤ G.minDegree. Disjoint cycles are given either as closed walks that are cycles with
    pairwise disjoint supports, or (corradi_hajnal_sets) as pairwise disjoint vertex sets each
    inducing a non-acyclic subgraph.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the statements
    were compared with the theorem of Corrádi and Hajnal and checked on small complete graphs
    (CorradiHajnal/Sanity.lean: K₃ has one but not two disjoint cycles, K₆ has two, K₅ does
    not), and the copied definition was compared with the registered entry. No independent human
    mathematical review has been performed. The result is classical; no mathematical novelty is
    claimed.

alignment:
  namespace: "CorradiHajnalTheorem"
  statements:
    - source: "Corrádi–Hajnal (1963): n ≥ 3k and δ ≥ 2k give k vertex-disjoint cycles"
      lean: "CorradiHajnalTheorem.corradi_hajnal"
      module: "Challenge"
      status: "proved"
    - source: "Corrádi–Hajnal, with the disjoint cycles of the Erdős–Pósa entry"
      lean: "CorradiHajnalTheorem.corradi_hajnal_sets"
      module: "Challenge"
      status: "proved"
    - source: "k disjoint cycles need at least 3k vertices"
      lean: "CorradiHajnalTheorem.three_mul_le_card_of_hasDisjointCycles"
      module: "Challenge"
      status: "proved"
    - source: "Sharpness of the order condition: K_{3k−1}, k ≥ 2"
      lean: "CorradiHajnalTheorem.not_hasDisjointCycles_top"
      module: "Challenge"
      status: "proved"
    - source: "Sharpness of the degree condition: K_{2k−1, m}, m ≥ 2k"
      lean: "CorradiHajnalTheorem.not_hasDisjointCycles_completeBipartite"
      module: "Challenge"
      status: "proved"

acknowledgements: >-
  Mathlib and the Lean community; Harmonic's Aristotle.
